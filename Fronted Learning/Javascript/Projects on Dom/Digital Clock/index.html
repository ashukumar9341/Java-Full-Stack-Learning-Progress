<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: bisque;">
    
    <div class="country">
        <h1 id="digitalClock">Digital Clock</h1>
        <div class="clockContainer">
            <h2 id="ditalClock">00:00:00</h2>
            <p id="date"></p>
        </div>
    </div>
    <form class="form">
        <label for="CounrtyInput">Country</label>
    
        <input type="text" id="CounrtyInput">
        
        <select name="" id="country">
            <option value="">select country</option>
            <option value="India"> India</option>
            <option value="Russia"> Russia</option>
            <option value="USA"> USA</option>
            <option value="china"> China</option>
            <option value="UK"> UK</option>
            <option value="Germany"> Germany</option>
        </select>
    </form>

    <div class="toggle">
        <button class="active" id="twelve"> 12-Hour</button>
        <button class="active" id="twentyFour">24-Hour</button>
         
    </div>
    
   

    <script src="script.js"></script>
</body>
</html>
